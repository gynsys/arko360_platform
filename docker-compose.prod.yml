version: '3.8'

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arko360}
    volumes:
      - arko_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  backend:
    image: ghcr.io/gynsys/arko360_platform/backend:latest
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-arko360}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

  admin-frontend:
    image: ghcr.io/gynsys/arko360_platform/admin-frontend:latest
    restart: always
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=http://backend:8001/api/v1

  landing-frontend:
    image: ghcr.io/gynsys/arko360_platform/landing-frontend:latest
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:8001/api/v1

  super-admin-frontend:
    image: ghcr.io/gynsys/arko360_platform/super-admin-frontend:latest
    restart: always
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=http://backend:8001/api/v1

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-frontend
      - landing-frontend
      - super-admin-frontend
      - backend

volumes:
  arko_db_data:
